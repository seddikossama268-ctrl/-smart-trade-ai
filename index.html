<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trade AI - منصة التداول الآلي بالذكاء الاصطناعي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0e11;
            color: #eaecef;
            user-select: none;
        }
        .bg-card { background-color: #181a20; }
        .bg-card-hover:hover { background-color: #2b313a; }
        .border-custom { border-color: #2b313a; }
        .green-glow { text-shadow: 0 0 12px rgba(14, 203, 129, 0.4); }
        .red-glow { text-shadow: 0 0 12px rgba(246, 70, 93, 0.4); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0b0e11; }
        ::-webkit-scrollbar-thumb { background: #2b313a; border-radius: 3px; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-6">

    <!-- Header -->
    <header class="bg-card border-b border-custom px-4 py-3 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center space-x-2 space-x-reverse">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-yellow-500 to-amber-300 flex items-center justify-center text-gray-900 font-bold shadow-lg">
                <i class="fa-solid fa-robot text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm leading-tight">Smart Trade AI</h1>
                <p class="text-[10px] text-gray-400">منصة التداول الآلي بالذكاء الاصطناعي</p>
            </div>
        </div>
        <div id="wallet-box" class="bg-[#21262d] px-3 py-1.5 rounded-lg border border-custom text-xs font-semibold text-amber-400">
            رصيد المحفظة: <span id="wallet-balance">100,000.00</span>$
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 px-3 py-4 max-w-lg mx-auto w-full space-y-4">
        
        <!-- Crypto Pair 1: BTC -->
        <div onclick="selectPair('BTC/USDT', 64250.50)" class="bg-card bg-card-hover border border-custom p-4 rounded-xl cursor-pointer transition flex justify-between items-center shadow-md">
            <div>
                <span class="text-xs text-gray-400 block mb-1">BTC / USDT</span>
                <h3 class="text-lg font-bold tracking-wide" id="btc-price">64,250.50</h3>
            </div>
            <div class="text-left">
                <span class="text-xs px-2 py-1 rounded bg-emerald-500/10 text-emerald-400 font-semibold green-glow">+2.45%</span>
            </div>
        </div>

        <!-- Crypto Pair 2: ETH -->
        <div onclick="selectPair('ETH/USDT', 3480.20)" class="bg-card bg-card-hover border border-custom p-4 rounded-xl cursor-pointer transition flex justify-between items-center shadow-md">
            <div>
                <span class="text-xs text-gray-400 block mb-1">ETH / USDT</span>
                <h3 class="text-lg font-bold tracking-wide" id="eth-price">3,480.20</h3>
            </div>
            <div class="text-left">
                <span class="text-xs px-2 py-1 rounded bg-emerald-500/10 text-emerald-400 font-semibold green-glow">+1.82%</span>
            </div>
        </div>

        <!-- Trading Dashboard Section -->
        <div class="bg-card border border-custom p-4 rounded-xl space-y-3">
            <div class="flex justify-between items-center">
                <div class="flex space-x-1 space-x-reverse">
                    <button class="text-xs px-2.5 py-1 rounded bg-emerald-600 text-white font-medium">1M</button>
                    <button class="text-xs px-2.5 py-1 rounded bg-gray-800 text-gray-400">15M</button>
                    <button class="text-xs px-2.5 py-1 rounded bg-gray-800 text-gray-400">1H</button>
                    <button class="text-xs px-2.5 py-1 rounded bg-gray-800 text-gray-400">1D</button>
                </div>
                <span id="active-pair" class="text-xs font-bold text-amber-400">BTC / USDT</span>
            </div>

            <!-- Price Display -->
            <div class="flex justify-between items-center">
                <span id="active-price" class="text-xl font-bold">64,250.50</span>
            </div>

            <!-- Simple Chart Simulation Box -->
            <div class="h-32 bg-[#0b0e11] border border-custom rounded-lg flex items-center justify-center text-gray-500 text-xs">
                [ الرسم البياني التفاعلي للأسعار ]
            </div>

            <!-- Buy / Sell Action Buttons -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="tradeAction('SELL')" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition shadow-lg red-glow text-sm flex items-center justify-center space-x-1 space-x-reverse">
                    <i class="fa-solid fa-arrow-trend-down"></i>
                    <span>بيع (SELL)</span>
                </button>
                <button onclick="tradeAction('BUY')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg green-glow text-sm flex items-center justify-center space-x-1 space-x-reverse">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                    <span>شراء (BUY)</span>
                </button>
            </div>
        </div>
    </main>

    <script>
        let balance = 100000.00;
        let currentPairSymbol = 'BTC/USDT';
        let currentPairPrice = 64250.50;

        function selectPair(symbol, price) {
            currentPairSymbol = symbol;
            currentPairPrice = price;
            document.getElementById('active-pair').innerText = symbol;
            document.getElementById('active-price').innerText = price.toLocaleString();
        }

        function tradeAction(type) {
            if (balance >= currentPairPrice) {
                if (type === 'BUY') {
                    balance -= currentPairPrice;
                    alert('تم تنفيذ عملية الشراء بنجاح لـ ' + currentPairSymbol);
                } else {
                    balance += currentPairPrice;
                    alert('تم تنفيذ عملية البيع بنجاح لـ ' + currentPairSymbol);
                }
                document.getElementById('wallet-balance').innerText = balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            } else {
                alert('رصيد المحفظة غير كافٍ لإتمام العملية!');
            }
        }
    </script>
</body>
</html>
