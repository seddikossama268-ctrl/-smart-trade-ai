<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trade AI - منصة التداول الآلي بالذكاء الاصطناعي</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .wallet {
            background: #21262d;
            padding: 8px 12px;
            border-radius: 8px;
            color: #3fb950;
            font-weight: bold;
        }
        .crypto-card, .chart-section {
            background: #161b22;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            border: 1px solid #30363d;
        }
        .crypto-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .crypto-card:hover {
            border-color: #58a6ff;
        }
        .timeframes {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .tf-btn {
            background: #21262d;
            color: #c9d1d9;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .tf-btn.active {
            background: #238636;
            color: white;
        }
        .trade-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .trade-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .buy-btn {
            background-color: #238636;
            color: white;
        }
        .sell-btn {
            background-color: #da3633;
            color: white;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h3 style="margin: 0; color: #fff;">Smart Trade AI</h3>
            <span style="font-size: 12px; color: #8b949e;">منصة التداول الآلي بالذكاء الاصطناعي</span>
        </div>
        <div class="wallet">
            رصيد المحفظة: $<span id="walletBalance">10,000.00</span>
        </div>
    </div>

    <!-- قائمة العملات -->
    <div class="crypto-card" onclick="selectCrypto('BTC / USDT', 64250.50)">
        <div>
            <span style="color: #3fb950; font-size: 14px;">+2.45%</span>
            <h4 style="margin: 5px 0 0 0; color: #fff;">BTC / USDT</h4>
        </div>
        <span style="font-size: 18px; font-weight: bold; color: #fff;">$64,250.50</span>
    </div>

    <div class="crypto-card" onclick="selectCrypto('ETH / USDT', 3480.20)">
        <div>
            <span style="color: #3fb950; font-size: 14px;">+1.82%</span>
            <h4 style="margin: 5px 0 0 0; color: #fff;">ETH / USDT</h4>
        </div>
        <span style="font-size: 18px; font-weight: bold; color: #fff;">$3,480.20</span>
    </div>

    <!-- قسم الشارت والتداول -->
    <div class="chart-section">
        <div class="timeframes">
            <button class="tf-btn" onclick="setTf(this)">1D</button>
            <button class="tf-btn" onclick="setTf(this)">1H</button>
            <button class="tf-btn" onclick="setTf(this)">15M</button>
            <button class="tf-btn active" onclick="setTf(this)">1M</button>
        </div>
        
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h4 id="selectedPair" style="margin: 0; color: #fff;">BTC / USDT</h4>
            <span style="color: #3fb950; font-weight: bold;" id="selectedPrice">$64,250.50</span>
        </div>

        <div style="height: 120px; display: flex; align-items: center; justify-content: center; color: #8b949e; border: 1px dashed #30363d; margin-top: 10px; border-radius: 6px;">
            [ الرسم البياني التفاعلي للأسعار ]
        </div>

        <!-- أزرار البيع والشراء الجديدة -->
        <div class="trade-buttons">
            <button class="trade-btn buy-btn" onclick="executeTrade('BUY')">شراء (BUY)</button>
            <button class="trade-btn sell-btn" onclick="executeTrade('SELL')">بيع (SELL)</button>
        </div>
    </div>

    <script>
        let balance = 10000.00;
        let currentPrice = 64250.50;
        let currentPairName = "BTC / USDT";

        function selectCrypto(pair, price) {
            currentPairName = pair;
            currentPrice = price;
            document.getElementById('selectedPair').innerText = pair;
            document.getElementById('selectedPrice').innerText = '$' + price.toLocaleString();
        }

        function setTf(btn) {
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function executeTrade(type) {
            if (type === 'BUY') {
                if (balance >= currentPrice) {
                    balance -= currentPrice;
                    alert('تم تنفيذ صفقة شراء بنجاح على ' + currentPairName);
                } else {
                    alert('رصيد المحفظة غير كافٍ لإتمام الشراء!');
                }
            } else {
                balance += currentPrice;
                alert('تم تنفيذ صفقة بيع بنجاح على ' + currentPairName);
            }
            document.getElementById('walletBalance').innerText = balance.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        }
    </script>
</body>
</html>
